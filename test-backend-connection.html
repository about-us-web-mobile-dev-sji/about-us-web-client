<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Connexion Backend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }

        .result strong {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 Test Connexion Backend</h1>
        <p class="subtitle">Vérifie que ton frontend peut communiquer avec ton backend</p>

        <div class="input-group">
            <label for="backendUrl">URL du Backend</label>
            <input 
                type="text" 
                id="backendUrl" 
                value="http://localhost:3000" 
                placeholder="http://localhost:3000"
            />
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="testConnection()">
                <span id="btnText">Tester la connexion</span>
            </button>
            <button class="btn-secondary" onclick="testSchoolEndpoint()">
                Tester /schools
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        async function testConnection() {
            const btn = event.target.closest('button');
            const btnText = document.getElementById('btnText');
            const result = document.getElementById('result');
            const backendUrl = document.getElementById('backendUrl').value.trim();

            if (!backendUrl) {
                showResult('error', 'Erreur', 'Veuillez entrer une URL de backend.');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>Test en cours...';
            result.style.display = 'none';

            try {
                const response = await fetch(backendUrl, {
                    method: 'GET',
                    credentials: 'include',
                });

                const data = await response.text();

                showResult(
                    'success',
                    '✅ Backend accessible !',
                    `Le backend répond avec le status ${response.status}.\n\nRéponse:\n${data.substring(0, 200)}${data.length > 200 ? '...' : ''}`
                );
            } catch (error) {
                showResult(
                    'error',
                    '❌ Erreur de connexion',
                    `Impossible de se connecter au backend:\n\n${error.message}\n\nAssure-toi que:\n- Le backend est lancé\n- L'URL est correcte\n- CORS est configuré`
                );
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Tester la connexion';
            }
        }

        async function testSchoolEndpoint() {
            const btn = event.target;
            const result = document.getElementById('result');
            const backendUrl = document.getElementById('backendUrl').value.trim();

            if (!backendUrl) {
                showResult('error', 'Erreur', 'Veuillez entrer une URL de backend.');
                return;
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span>Test en cours...';
            result.style.display = 'none';

            try {
                const response = await fetch(`${backendUrl}/schools`, {
                    method: 'GET',
                    credentials: 'include',
                });

                if (response.ok) {
                    const data = await response.json();
                    showResult(
                        'success',
                        '✅ Endpoint /schools fonctionne !',
                        `Status: ${response.status}\n\nRéponse:\n${JSON.stringify(data, null, 2)}`
                    );
                } else if (response.status === 401) {
                    showResult(
                        'info',
                        '🔐 Authentification requise',
                        `L'endpoint existe mais nécessite une authentification.\nStatus: ${response.status}\n\nC'est normal ! Connecte-toi d'abord sur l'application.`
                    );
                } else {
                    const text = await response.text();
                    showResult(
                        'error',
                        `❌ Erreur ${response.status}`,
                        `L'endpoint a répondu avec une erreur:\n\n${text}`
                    );
                }
            } catch (error) {
                showResult(
                    'error',
                    '❌ Erreur de connexion',
                    `Impossible d'accéder à /schools:\n\n${error.message}\n\nVérifie que:\n- Le backend est lancé\n- L'endpoint /schools existe\n- CORS est configuré`
                );
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function showResult(type, title, message) {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            result.innerHTML = `<strong>${title}</strong><pre>${message}</pre>`;
            result.style.display = 'block';
        }

        // Test automatique au chargement (optionnel)
        // window.addEventListener('load', () => setTimeout(testConnection, 500));
    </script>
</body>
</html>
