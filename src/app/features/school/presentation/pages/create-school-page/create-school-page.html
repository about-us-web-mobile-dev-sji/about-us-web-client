<div class="create-school-page">
  <div class="page-header">
    <h1 i18n="@@create-school-title" class="page-title">Enregistrer une nouvelle école</h1>
    <p i18n="@@create-school-description" class="page-description">
      Remplis les informations ci-dessous pour créer un nouvel espace administratif sur la
      plateforme.
    </p>
  </div>

  <div class="page-content">
    <p-message i18n="@@create-school-required-fields" severity="info" variant="simple">
      Les champs marqués d'un astérisque (*) sont obligatoires.
    </p-message>

    <app-create-school-form
      [isLoading]="isLoading"
      (submitSchool)="onSchoolSubmit($event)"
    ></app-create-school-form>
  </div>
</div>

<p-toast position="top-right" />
