<form
  [formGroup]="schoolForm"
  (ngSubmit)="onSubmit()"
  class="grid gap-5"
  novalidate
  [attr.aria-busy]="isLoading"
>
  <div class="grid gap-4">
    <h2 class="m-0 text-base font-semibold">Informations de l'école</h2>

    <div class="flex flex-col gap-1.5">
      <label for="name" class="text-sm font-medium">Nom *</label>
      <input
        pInputText
        id="name"
        type="text"
        formControlName="name"
        [readonly]="isLoading"
        placeholder="École primaire Jean Moulin"
      />
      @if (nameControl.invalid && nameControl.touched) {
        <p-message severity="error" variant="simple" size="small">
          {{
            nameControl.hasError('required')
              ? 'Le nom est obligatoire.'
              : 'Le nom doit contenir au moins 3 caractères.'
          }}
        </p-message>
      }
    </div>
  </div>

  <div class="flex justify-end gap-2">
    @if (showReset) {
      <button pButton type="button" severity="secondary" (click)="onReset()" [disabled]="isLoading">
        Réinitialiser
      </button>
    }
    <button pButton type="submit" [disabled]="isLoading">
      <span>{{ isLoading ? 'Enregistrement…' : submitLabel }}</span>
    </button>
  </div>
</form>
