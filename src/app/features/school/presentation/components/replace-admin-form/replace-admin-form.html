<form class="grid gap-5" novalidate [attr.aria-busy]="isLoading()" (ngSubmit)="onSubmit()">
  <div class="grid gap-1.5">
    <label for="new-admin" class="text-sm font-medium">Nouvel administrateur</label>
    <p-select
      inputId="new-admin"
      name="newAdmin"
      class="w-full"
      [options]="options()"
      optionValue="id"
      optionLabel="fullName"
      [ngModel]="selectedId()"
      (ngModelChange)="selectedId.set($event)"
      [filter]="true"
      [filterFields]="['fullName', 'email']"
      filterPlaceholder="Rechercher par nom ou e-mail"
      (onFilter)="onFilter($event)"
      [loading]="isSearching()"
      [invalid]="touched() && !selectedId()"
      [disabled]="isLoading()"
      placeholder="Choisir un membre de l'école"
      emptyMessage="Aucun membre actif ne correspond."
      emptyFilterMessage="Aucun membre actif ne correspond."
      appendTo="body"
      [attr.aria-describedby]="touched() && !selectedId() ? 'new-admin-error' : 'new-admin-help'"
    >
      <ng-template #selectedItem let-user>
        <app-user-chip [user]="user" size="sm" />
      </ng-template>
      <ng-template #item let-user>
        <app-user-chip [user]="user" [showEmail]="true" size="sm" />
      </ng-template>
    </p-select>
    @if (touched() && !selectedId()) {
      <p-message id="new-admin-error" severity="error" variant="simple" size="small">Choisissez le membre qui deviendra administrateur.</p-message>
    } @else {
      <small id="new-admin-help" class="text-xs text-muted-color">Seuls les membres actifs de l'école peuvent être choisis.</small>
    }
  </div>

  <p class="m-0 rounded-lg bg-(--au-subtle) px-4 py-3 text-sm leading-[1.375rem] text-muted-color">
    L'administrateur actuel perd son accès à l'école : son adhésion est révoquée. Son historique d'activité est conservé.
  </p>

  <div class="flex justify-end gap-2">
    <p-button type="button" label="Annuler" severity="secondary" [text]="true" [disabled]="isLoading()" (onClick)="cancel.emit()" />
    <p-button type="submit" label="Remplacer l'administrateur" [loading]="isLoading()" />
  </div>
</form>
